[package]
name = "sprout"
version = "0.3.0"
edition = "2021"
description = "Pitwall: a terminal workspace for agent work"
default-run = "sprout"

[dependencies]
ratatui = { version = "=0.30.1", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "=0.29.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "=3.7.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ratatui-image = { version = "=11.0.0", default-features = false }
base64-simd = "=0.8.0"

ratatui-textarea = "=0.9.4"
